[package]
name = "farmingo"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy = { version = "0.14.2"}
avian3d = "0.1.2"
bevy_editor_pls = "0.9.0"
bevy_framepace = "0.17.1"
bevy_mod_picking = { version = "0.20.1", default-features = false, features = [
    "backend_raycast",
    "backend_bevy_ui",
    "backend_sprite",
    "debug",
    "selection",
    "highlight",
]}
bevy_turborand = "0.9.0"
bevy_vector_shapes = "0.8.2"
smooth-bevy-cameras = "0.12.0"
bevy_mod_billboard = "0.7.0"
bevy_screen_diagnostics = "0.6.0"

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3
